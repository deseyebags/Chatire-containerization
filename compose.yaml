services:
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: "chatire"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "password"
      DB_HOST: postgres
      DB_PORT: 5432
      RABBITMQ_HOST: rabbitmq
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmqctl status"]
      interval: 10s
      timeout: 5s
      retries: 5

  chat:
    build:
      context: .
      dockerfile: ./Dockerfile-BE
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SETTINGS_MODULE: chatire.settings
      DB_NAME: chatire
      DB_USER: postgres
      DB_PASSWORD: password
      DB_HOST: postgres
      DB_PORT: 5432
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    depends_on:
      - postgres
      - redis
      - rabbitmq
    ports:
      - "8000:8000"
    restart: always

  redis:
    image: redis:6-alpine
    ports:
      - "6379:6379"

  chat-ws:
    build:
      context: .
      dockerfile: ./Dockerfile-ws
    command: sh -c "uwsgi --http :8081 --gevent 100 --module websocket --gevent-monkey-patch --master --processes 4"
    environment:
      DJANGO_SETTINGS_MODULE: chatire.settings
      DB_NAME: chatire
      DB_USER: postgres
      DB_PASSWORD: password
      DB_HOST: postgres
      DB_PORT: 5432
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    depends_on:
      - redis
      - postgres
      - rabbitmq
    ports:
      - "8081:8081"
    restart: always

  # chat-ws:
  #   build:
  #     context: .
  #     dockerfile: ./Dockerfile-BE
  #   command: sh -c "python manage.py migrate channels_postgres && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
  #   environment:
  #     DJANGO_SETTINGS_MODULE: chatire.settings
  #     DB_NAME: chatire
  #     DB_USER: postgres
