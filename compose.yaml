  #   depends_on:
  #     - redis
  #     - postgres
  #     - rabbitmq
  #   ports:
  #     - "8081:8000"
  #   restart: always

  chatire-frontend:
    build:
      context: ./chatire-frontend
      dockerfile: ./Dockerfile-FE
    depends_on:
      - chat
    ports:
      - "8080:8080"
    restart: always

volumes:
  pgdata:
